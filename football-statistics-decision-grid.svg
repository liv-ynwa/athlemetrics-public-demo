<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#fff7ed"/>
  <text x="55" y="70" font-family="Arial" font-size="36" font-weight="700" fill="#7c2d12">Statistics-to-Decision Grid (Illustrative)</text>

  <rect x="55" y="110" width="1090" height="70" fill="#fed7aa"/>
  <text x="85" y="153" font-family="Arial" font-size="24" fill="#7c2d12">Question</text>
  <text x="375" y="153" font-family="Arial" font-size="24" fill="#7c2d12">Primary Metric</text>
  <text x="700" y="153" font-family="Arial" font-size="24" fill="#7c2d12">Decision Trigger</text>

  <g font-family="Arial" font-size="22" fill="#431407">
    <rect x="55" y="180" width="1090" height="88" fill="#ffedd5"/>
    <text x="85" y="234">Why are we conceding late chances?</text>
    <text x="375" y="234">xGA after 70'</text>
    <text x="700" y="234">If +20% vs baseline, switch to lower block</text>

    <rect x="55" y="268" width="1090" height="88" fill="#fff1e6"/>
    <text x="85" y="322">Is buildup too predictable?</text>
    <text x="375" y="322">Pass direction entropy</text>
    <text x="700" y="322">If low for 3 matches, redesign phase 1 patterns</text>

    <rect x="55" y="356" width="1090" height="88" fill="#ffedd5"/>
    <text x="85" y="410">Which winger profile fits our transitions?</text>
    <text x="375" y="410">Carries into box + recovery pace</text>
    <text x="700" y="410">Recruit if percentile >75 in both metrics</text>
  </g>

  <text x="55" y="525" font-family="Arial" font-size="22" fill="#7c2d12">Use the same grid weekly to avoid dashboard noise and keep decisions consistent.</text>
</svg>
